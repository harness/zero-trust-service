# Template mappings — route specific templates to non-default providers/repos.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zero-trust-service-mappings
  namespace: zero-trust-service
  labels:
    app.kubernetes.io/name: zero-trust-service
data:
  mappings.yaml: |
    runstp:
      provider: harness-code
      repo: "test"
    runstpaccount:
      version: "v2"
      provider: gitlab-main
      repo: "gitlab-test"
      path: ".harness/thisiscustompath/v2.yaml"
