port: ${ZTS_SERVER_PORT:-4210}
admin_port: ${ZTS_ADMIN_PORT:-8898}

audit:
  enabled: ${ZTS_AUDIT_ENABLED:-true}
  dir: "${ZTS_AUDIT_DIR:-/var/log/zts/audits}"
  max_age_days: ${ZTS_AUDIT_MAX_AGE_DAYS:-30}

validators:
  global:
    - type: require_account
      enabled: ${ZTS_REQUIRE_ACCOUNT_ENABLED:-true}
      config:
        allowed_accounts: ${ZTS_ALLOWED_ACCOUNTS:-["kmpySmUISimoRrJL6NL73w"]}
    - type: step_lookup
      enabled: ${ZTS_STEP_LOOKUP_ENABLED:-false}
      config:
        log_found: ${ZTS_STEP_LOOKUP_LOG_FOUND:-true}
        log_missing: ${ZTS_STEP_LOOKUP_LOG_MISSING:-true}
    # Reference execution-ordering verifier: for the step being verified, checks
    # that its ancestors (per the resolved pipeline DAG) have already run in this
    # plan execution. Needs the resolver enabled (it uses the resolved YAML) and
    # keeps per-planExecutionId run-state in memory (see examples/zts/ordering).
    - type: execution_ordering
      enabled: ${ZTS_EXECUTION_ORDERING_ENABLED:-true}
      config:
        # true = enforce (deny the task when ancestors haven't run or a `when`
        # guard fails); false = observe only (log the verdict, never block).
        deny_on_missing: ${ZTS_EXECUTION_ORDERING_DENY_ON_MISSING:-true}
        # Matrix instance-naming; must match the engine setting.
        #   index -> _0_0, _0_1, ...  (positional axis indices)
        #   value -> _us_free, ...    (axis values)
        matrix_naming: ${ZTS_EXECUTION_ORDERING_MATRIX_NAMING:-index}
        # Force a run/skip decision for a `when` expression, keyed by the exact
        # expression string mapped to true (run) / false (skip). Effective only when
        # a condition checker is wired in code (the reference wiring enforces ordering
        # only). Single-quote keys so inner double quotes stay literal.
        condition_overrides:
          '<+pipeline.variables.name> == "override-me"': false
          '<+pipeline.variables.env> == "prod"': true
          '1==2': true
          '1==1': true
        # A `when` guard that cannot be evaluated always fails closed (the step is
        # denied): there is no fail-open opt-out, matching the SDK's ancestor
        # walk-up, which never steps over an unresolvable guard.
    # Deny any task type in denied_types (delegate + GitOps). Same pattern as require_account: one global policy.
    - type: task_denylist
      enabled: ${ZTS_TASK_DENYLIST_ENABLED:-false}
      config:
        denied_types: ${ZTS_DENIED_TASK_TYPES:-[]}

  by_task_type:
    SHELL_SCRIPT_TASK_NG:
      - type: shellscript
        enabled: ${ZTS_SHELLSCRIPT_ENABLED:-false}
        config:
          bash: ${ZTS_SHELLSCRIPT_ALLOWED_COMMANDS:-["echo"]}

    INITIALIZATION_PHASE:
      - type: image_allowlist
        enabled: ${ZTS_IMAGE_ALLOWLIST_ENABLED:-true}
        config:
          allowed_prefixes: ${ZTS_IMAGE_ALLOWED_PREFIXES:-["harness/", "library/"]}

    CI_EXECUTE_STEP:
      - type: image_allowlist
        enabled: ${ZTS_IMAGE_ALLOWLIST_ENABLED:-true}
        config:
          allowed_prefixes: ${ZTS_IMAGE_ALLOWED_PREFIXES:-["harness/", "library/"]}

    CONTAINER_INITIALIZATION:
      - type: image_allowlist
        enabled: ${ZTS_IMAGE_ALLOWLIST_ENABLED:-true}
        config:
          allowed_prefixes: ${ZTS_IMAGE_ALLOWED_PREFIXES:-["harness/", "library/"]}

    GITOPS_APP_SYNC:
      - type: require_account
        enabled: ${ZTS_GITOPS_APP_SYNC_ACCOUNT_CHECK:-true}
        config:
          allowed_accounts: ${ZTS_ALLOWED_ACCOUNTS:-["kmpySmUISimoRrJL6NL73w"]}

    GITOPS_APP_DELETE:
      - type: require_account
        enabled: ${ZTS_GITOPS_APP_DELETE_ACCOUNT_CHECK:-true}
        config:
          allowed_accounts: ${ZTS_ALLOWED_ACCOUNTS:-["kmpySmUISimoRrJL6NL73w"]}

    GITOPS_CLUSTER_CREATE:
      - type: require_account
        enabled: ${ZTS_GITOPS_CLUSTER_CREATE_ACCOUNT_CHECK:-false}
        config:
          allowed_accounts: ${ZTS_ALLOWED_ACCOUNTS:-["kmpySmUISimoRrJL6NL73w"]}

    GITOPS_REPO_CREATE:
      - type: require_account
        enabled: ${ZTS_GITOPS_REPO_CREATE_ACCOUNT_CHECK:-false}
        config:
          allowed_accounts: ${ZTS_ALLOWED_ACCOUNTS:-["kmpySmUISimoRrJL6NL73w"]}

  custom:
    - type: webhook
      enabled: ${ZTS_WEBHOOK_ENABLED:-false}
      config:
        name: "${ZTS_WEBHOOK_NAME:-policy-service}"
        url: "${ZTS_WEBHOOK_URL:-http://localhost:5050/zts/validate}"
        timeout: "${ZTS_WEBHOOK_TIMEOUT:-5s}"
        fail_open: ${ZTS_WEBHOOK_FAIL_OPEN:-false}
        method: "POST"
        allowed_status_codes: [200, 202]

resolver:
  enabled: ${ZTS_RESOLVER_ENABLED:-false}
  output_dir: "${ZTS_RESOLVER_OUTPUT_DIR}"
  scm:
    providers:
      github-main:
        driver: github
        url: "${ZTS_GITHUB_URL:-https://api.github.com}"
        token: "${GITHUB_TOKEN}"
        owner: "${ZTS_GITHUB_OWNER}"
        repo: "${ZTS_GITHUB_REPO}"
        branch: "${ZTS_GITHUB_BRANCH:-main}"
        base_path: "${ZTS_GITHUB_BASE_PATH:-.harness}"
      gitlab-main:
        driver: gitlab
        url: "${ZTS_GITLAB_URL:-https://gitlab.com}"
        token: "${GITLAB_TOKEN}"
        owner: "${ZTS_GITLAB_OWNER}"
        repo: "${ZTS_GITLAB_REPO}"
        branch: "${ZTS_GITLAB_BRANCH:-main}"
        base_path: "${ZTS_GITLAB_BASE_PATH:-.harness}"
      harness-code:
        driver: harness
        url: "${ZTS_HARNESS_URL:-https://app.harness.io/gateway/code}"
        token: "${HARNESS_CODE_TOKEN}"
        owner: "${ZTS_HARNESS_OWNER}"
        repo: "${ZTS_HARNESS_REPO}"
        branch: "${ZTS_HARNESS_BRANCH:-main}"
        base_path: "${ZTS_HARNESS_BASE_PATH:-.harness}"
  templates:
    default_provider: "${ZTS_DEFAULT_PROVIDER:-github-main}"
    template_mappings_file: "${ZTS_TEMPLATE_MAPPINGS_FILE:-mappings.yaml}"
