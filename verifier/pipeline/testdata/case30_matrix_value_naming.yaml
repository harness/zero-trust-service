# Value-based matrix naming (sorted by axis key): declared region,cloud sorts to
# cloud,region -> build_aws_us_1/build_aws_eu/build_gcp_us_1/build_gcp_eu ("us-1"
# -> "us_1"). Needs WithMatrixNaming(MatrixNamingValue).
pipeline:
  identifier: case30
  stages:
    - stage:
        identifier: st1
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  identifier: build
                  type: ShellScript
                  strategy:
                    matrix:
                      region: [us-1, eu]
                      cloud: [aws, gcp]
              - step:
                  identifier: after
                  type: ShellScript
